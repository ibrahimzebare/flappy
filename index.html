<title>یاریا فڕینێ — by Ibrahim Zebare</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#dff1fb;--fg:#10222f;--panel:rgba(255,255,255,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1420;--fg:#eef5fa;--panel:rgba(20,34,48,.85)}}
:root[data-theme="dark"]{--bg:#0b1420;--fg:#eef5fa;--panel:rgba(20,34,48,.85)}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
#wrap{position:relative;height:100%;max-height:760px;aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25)}
canvas{width:100%;height:100%;display:block}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;gap:10px;color:var(--fg)}
#msg h1{margin:0;font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.3)}
#msg .c{margin:0;font-size:15px;color:#fff;opacity:.9;text-shadow:0 2px 6px rgba(0,0,0,.4)}
#msg .t{margin:0;font-size:17px;background:var(--panel);padding:9px 18px;border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#intro{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;background:radial-gradient(circle at 50% 35%,#1d3a63,#0a1224 70%);color:#fff;transition:opacity .8s,visibility .8s;overflow:hidden}
#intro.off{opacity:0;visibility:hidden}
#intro .b{font-size:76px;animation:pop 1s cubic-bezier(.2,1.6,.4,1) both,fl 2.4s 1s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(255,200,60,.55))}
#intro .s1,#intro .s2,#intro .tap{opacity:0;font-size:17px;line-height:1.6}
#intro .s1{animation:up .8s .6s forwards}
#intro .nm{font-size:40px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#ffd54a,#ff8a65,#ffd54a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:up .9s 1.1s forwards,sh 3s 1.1s linear infinite}
#intro .s2{animation:up .8s 1.8s forwards}
#intro .tap{position:absolute;bottom:44px;font-size:13px;animation:up .8s 2.6s forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:.95;transform:none}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes fl{50%{transform:translateY(-14px) rotate(-6deg)}}
@keyframes sh{to{background-position:200% 0}}
@keyframes tw{to{opacity:.9}}
#intro .logo{position:relative;width:156px;height:156px;border-radius:50%;box-shadow:0 0 50px rgba(255,190,60,.4);animation:pop 1s cubic-bezier(.2,1.6,.4,1) both}
#intro .ring{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(#ffd54a,#ff8a65,#fff3b0,#ffd54a,#ff8a65,#ffd54a);animation:spin 4s linear infinite}
#intro .logo img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #0a1224;box-sizing:border-box}
#msg .c img{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-inline-end:8px;border:2px solid #ffd54a}
@keyframes spin{to{transform:rotate(360deg)}}
#pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px;pointer-events:auto}
#pick button{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:var(--panel);padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
#pick button.on{border-color:#ffd54a;box-shadow:0 0 0 3px rgba(255,213,74,.55);transform:scale(1.1)}
@media (max-aspect-ratio:9/16){#wrap{height:auto;width:100%;border-radius:0;max-height:none}}
</style>
</head>

<div id="msg"><h1 id="ttl">یاریا فڕینێ</h1><p class="c" dir="ltr"><img id="av" alt="">by Ibrahim Zebare</p><p class="t" id="hint">پەنجێ لێ بدە دا بفڕێ</p><p class="t" id="best"></p><p class="c">هەلبژێرە کا تو دخوازی چ بفڕیت:</p><div id="pick"></div></div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg'),bestEl=document.getElementById('best'),ttl=document.getElementById('ttl'),hint=document.getElementById('hint');
const W=360,H=640,GH=80;
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d}
fit();addEventListener('resize',fit);
let best=0;try{best=+localStorage.getItem('flappy-best')||0}catch(e){}
const showBest=()=>bestEl.textContent='باشترین: '+best+' خاڵ · LEVEL '+lvOf(best);showBest();
// palettes: sky top, sky bottom, far hills, near hills, celestial
const PAL=[[[92,190,240],[200,236,252],[150,205,190],[96,170,110]],[[240,130,90],[252,208,140],[190,120,130],[120,110,100]],[[12,20,50],[40,50,100],[40,50,90],[30,60,70]]];
const lerp=(a,b,t)=>a+(b-a)*t,mix=(A,B,t)=>A.map((c,i)=>Math.round(lerp(c,B[i],t))),rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
let phase=0;
function pal(){const i=Math.floor(phase)%3,j=(i+1)%3,t=phase%1,tt=t<.6?0:(t-.6)/.4;return PAL[i].map((c,k)=>mix(c,PAL[j][k],tt))}
let bird,pipes,parts,clouds,stars,score,state='ready',last=0,spawn,shake=0,gx=0,fx=0,ax=0,hx=0,level=1,banner=0,win=false;
clouds=Array.from({length:6},(_,i)=>({x:Math.random()*W,y:40+Math.random()*220,s:.6+Math.random()*.9}));
stars=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*(H-GH-120),r:Math.random()*1.4+.4,p:Math.random()*6}));
const SF=document.createElement('canvas');SF.width=138;SF.height=92;
(function(){const f=SF.getContext('2d'),s=92/3;f.fillStyle='#ed2024';f.fillRect(0,0,138,s+1);f.fillStyle='#ffffff';f.fillRect(0,s,138,s+1);f.fillStyle='#278e43';f.fillRect(0,2*s,138,s);
const cx=69,cy=46,r0=14,r1=27,n=21;f.fillStyle='#fbd20f';
for(let i=0;i<n;i++){const a=i/n*6.2832-1.5708,w=3.14159/n*.55;f.beginPath();f.moveTo(cx+Math.cos(a-w)*r0,cy+Math.sin(a-w)*r0);f.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);f.lineTo(cx+Math.cos(a+w)*r0,cy+Math.sin(a+w)*r0);f.fill()}
f.beginPath();f.arc(cx,cy,r0,0,7);f.fill()})();
function reset(){bird={x:96,y:H/2,v:0,r:0,w:0};pipes=[];parts=[];score=0;spawn=0;phase=0;level=1;banner=0;win=false}
reset();
// sound
let ac;function beep(f,d,type='sine',v=.08){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function feathers(n,x,y,spd){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.8)*spd,vy:(Math.random()-.5)*spd,l:1,c:Math.random()<.5?'#fff':'#ffd54a'})}
let introOn=true;function flap(){if(introOn)return;
  if(state==='ready'){state='play';msg.style.display='none'}
  if(state==='play'){bird.v=-6.4;beep(520,.12,'triangle');feathers(4,bird.x-10,bird.y+4,3)}
  else if(state==='over'&&overT>35){reset();state='ready';ttl.textContent='یاریا فڕینێ';hint.textContent='پەنجێ لێ بدە دا بفڕێ';msg.style.display='flex';showBest()}
}
let overT=0;
addEventListener('pointerdown',e=>{e.preventDefault();flap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
function over(){
  state='over';overT=0;shake=14;beep(140,.4,'sawtooth',.1);feathers(26,bird.x,bird.y,9);
  if(score>best){best=score;try{localStorage.setItem('flappy-best',best)}catch(e){}}
  showBest();ttl.textContent=win?'🏆 سەرکەفتن! ٢٠٠ ئاست تەمام بوون':'یاری ب دوماهی هات';hint.textContent='LEVEL '+level+' · ئەنجام: '+score+' — پەنجێ لێ بدە دا ڕا بکەی';msg.style.display='flex';
}
function step(dt){
  const sp=curSp(),gap=Math.max(125,176-level*.8);
  bird.v+=.4*dt;bird.y+=bird.v*dt;bird.r=Math.max(-.5,Math.min(1.2,bird.v*.09));bird.w+=dt*.5;
  spawn-=dt;
  if(spawn<=0){const m=level>=5;pipes.push({x:W+10,top:80+Math.random()*(H-GH-gap-160),gap,done:false,ph:Math.random()*6,mv:m,amp:Math.min(16+level*.5,44)});spawn=Math.max(72,100-level*.5)}
  pipes.forEach(p=>{p.x-=sp*dt;p.ph+=.03*dt;p.off=p.mv?Math.sin(p.ph)*p.amp:0});
  pipes=pipes.filter(p=>p.x>-70);
  for(const p of pipes){
    const t=p.top+p.off;
    if(!p.done&&p.x+54<bird.x){p.done=true;score++;beep(880,.1,'square',.05);const nl=Math.min(200,1+Math.floor(score/3));if(nl>level){level=nl;banner=90;beep(1250,.25,'triangle',.07)}phase=(level-1)/8;if(score>=600){win=true;return over()}}
    if(bird.x+13>p.x&&bird.x-13<p.x+54&&(bird.y-13<t||bird.y+13>t+p.gap))return over();
  }
  if(bird.y>H-GH-13){bird.y=H-GH-13;return over()}
  if(bird.y<-30)bird.y=-30;
}
function curSp(){return 2.2+Math.min(level,60)*.02}
function lvOf(s){return Math.min(200,1+Math.floor(s/3))}
function draw(dt){
  const r=cv.width/W;ctx.setTransform(r,0,0,r,0,0);
  const sx=shake>0?(Math.random()-.5)*shake:0,sy=shake>0?(Math.random()-.5)*shake:0;shake=Math.max(0,shake-dt*.8);
  ctx.save();ctx.translate(sx,sy);
  const P=pal(),night=Math.max(0,Math.min(1,(phase%3-1.6)/.8)),vh=cv.height/r;
  // sky
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgb(P[0]));g.addColorStop(1,rgb(P[1]));ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,vh+40);
  // stars
  const ph3=phase%3;const sa=ph3>1.7?Math.min(1,(ph3-1.7)/.6):ph3<.4&&phase>2?1-ph3/.4:0;
  if(sa>0){ctx.fillStyle='#fff';stars.forEach(s=>{ctx.globalAlpha=sa*(.5+.5*Math.sin(s.p+performance.now()/500));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});ctx.globalAlpha=1}
  // sun / moon
  const cy=ph3<1.8?150+ph3*55:250+(ph3-1.8)*0;
  if(ph3<2){ctx.fillStyle='rgba(255,236,150,.35)';ctx.beginPath();ctx.arc(250,cy,48,0,7);ctx.fill();ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(250,cy,30,0,7);ctx.fill()}
  else{ctx.fillStyle='rgba(244,241,222,.25)';ctx.beginPath();ctx.arc(290,120,34,0,7);ctx.fill();ctx.fillStyle='#f4f1de';ctx.beginPath();ctx.arc(290,120,22,0,7);ctx.fill()}
  // clouds
  ctx.fillStyle=`rgba(255,255,255,${.85-night*.6})`;
  clouds.forEach(c=>{if(state==='play')c.x-=.25*c.s*dt;if(c.x<-90)c.x=W+60;const s=c.s;ctx.beginPath();ctx.arc(c.x,c.y,18*s,0,7);ctx.arc(c.x+20*s,c.y-8*s,22*s,0,7);ctx.arc(c.x+44*s,c.y,17*s,0,7);ctx.arc(c.x+22*s,c.y+6*s,18*s,0,7);ctx.fill()});
  // hills
  if(state==='play'){hx=(hx+.35*dt)%360;fx=(fx+.7*dt)%360;ax=(ax+.15*dt)%1000}
  const hill=(off,amp,base,col,per)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-10,H-GH);for(let x=-10;x<=W+10;x+=8)ctx.lineTo(x,base-Math.sin((x+off)/per*6.283)*amp-Math.sin((x+off)/per*12.5)*amp*.3);ctx.lineTo(W+10,H-GH);ctx.fill()};
  (()=>{const base=H-GH-60;ctx.save();ctx.beginPath();ctx.moveTo(-10,H-GH);for(let x=-10;x<=W+10;x+=6){const u=x+ax,t1=Math.abs(((u/200)%1+1)%1*2-1),t2=Math.abs(((u/100)%1+1)%1*2-1);ctx.lineTo(x,base-(35+95*t1+22*t2)*.82)}ctx.lineTo(W+10,H-GH);ctx.closePath();ctx.fillStyle=rgb(mix(P[2],[120,140,175],.55));ctx.fill();ctx.clip();ctx.fillStyle='rgba(255,255,255,'+(.9-night*.45)+')';ctx.fillRect(-10,0,W+20,H-GH-156);ctx.restore()})();
  hill(hx,34,H-GH-70,rgb(P[2]),360);hill(fx,26,H-GH-30,rgb(P[3]),240);
  for(let i=0;i<5;i++){const tx=((i*72-fx)%360+360)%360-20;if(tx>W+20)continue;const ty=H-GH-30-Math.sin((tx+fx)/240*6.283)*26-Math.sin((tx+fx)/240*12.5)*7.8+4,sz=.8+(i%3)*.18;ctx.fillStyle='#6b4a2b';ctx.fillRect(tx-2*sz,ty-8*sz,4*sz,10*sz);ctx.fillStyle=rgb(mix(P[3],[20,60,35],.55));for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(tx-(16-k*3)*sz,ty-(6+k*13)*sz);ctx.lineTo(tx,ty-(26+k*13)*sz);ctx.lineTo(tx+(16-k*3)*sz,ty-(6+k*13)*sz);ctx.fill()}}

    ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x+10,-10,5,t-14);ctx.fillRect(x+10,t+p.gap+26,5,H)});

  ctx.fillStyle='#d8c38a';ctx.fillRect(-10,H-GH,W+20,GH+200);
  ctx.fillStyle='#6cc24a';ctx.fillRect(-10,H-GH,W+20,14);ctx.fillStyle='#4aa032';ctx.fillRect(-10,H-GH+14,W+20,5);
  ctx.fillStyle='rgba(0,0,0,.08)';for(let x=-gx;x<W+40;x+=40){ctx.beginPath();ctx.moveTo(x,H-GH+19);ctx.lineTo(x+20,H-GH+19);ctx.lineTo(x+8,H-GH+60);ctx.lineTo(x-12,H-GH+60);ctx.fill()}

  {const x0=16,y0=26,t2=performance.now()/1000;ctx.fillStyle='#d9dde2';ctx.fillRect(x0-3,y0-6,3,74);ctx.fillStyle='#fbd20f';ctx.beginPath();ctx.arc(x0-1.5,y0-8,3.5,0,7);ctx.fill();

  if(state!=='ready'){ctx.textAlign='center';ctx.font='800 52px system-ui,sans-serif';ctx.lineWidth=7;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.strokeText(score,W/2,90);ctx.fillStyle='#fff';ctx.fillText(score,W/2,90);ctx.direction='ltr';ctx.font='700 15px system-ui,sans-serif';const pw=120,x0=W/2-pw/2;ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.roundRect(x0,104,pw,26,13);ctx.fill();ctx.fillStyle='rgba(255,213,74,.45)';ctx.beginPath();ctx.roundRect(x0,104,Math.max(8,pw*((score%3)/3)),26,13);ctx.fill();ctx.fillStyle='#fff';ctx.fillText('LEVEL '+level+' / 200',W/2,122);if(banner>0){banner=Math.max(0,banner-dt);ctx.globalAlpha=Math.min(1,banner/30);ctx.font='900 44px system-ui,sans-serif';ctx.lineWidth=7;ctx.strokeStyle='rgba(0,0,0,.4)';const by2=200-(90-banner)*.3;ctx.strokeText('LEVEL '+level,W/2,by2);ctx.fillStyle='#ffd54a';ctx.fillText('LEVEL '+level,W/2,by2);ctx.globalAlpha=1}ctx.direction='inherit'}
  ctx.restore();
}
const CH=[{a:'#ffe27a',b:'#f59f00'},{a:'#ff9a8a',b:'#e03131'},{a:'#8fd3ff',b:'#1c7ed6'},{a:'#a9e88a',b:'#2f9e44'},{a:'#d0a5ff',b:'#7048e8'},{e:'🚀',rot:.785},{e:'✈️',rot:.785},{e:'🛸'},{e:'🎈'},{e:'👻'},{e:'⚽'}];
let sel=0;try{sel=+localStorage.getItem('flappy-char')||0}catch(e){}if(!(sel>=0&&sel<CH.length))sel=0;

  if(ch.e){c.save();c.rotate(ch.rot||0);c.font='34px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.direction='ltr';c.fillText(ch.e,0,2);c.restore();return}

  c.fillStyle='#ff7043';c.beginPath();c.moveTo(12,0);c.lineTo(26,3);c.lineTo(12,8);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(8,-6,5.5,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(10,-6,2.6,0,7);c.fill();
  const wy=Math.sin(w*2)*7;c.fillStyle='#fff';c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1.5;c.beginPath();c.ellipse(-5,3+wy*.3,9,5+Math.abs(wy)*.4,-.3+wy*.04,0,7);c.fill();c.stroke();
}
(function(){const pk=document.getElementById('pick');
  CH.forEach((ch,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','character '+(i+1));const cn=document.createElement('canvas');cn.width=cn.height=80;cn.style.cssText='width:34px;height:34px';const x=cn.getContext('2d');x.translate(40,40);x.scale(1.45,1.45);drawChar(x,ch,0);b.appendChild(cn);if(i===sel)b.className='on';
    b.addEventListener('click',()=>{sel=i;try{localStorage.setItem('flappy-char',i)}catch(e){}[...pk.children].forEach((k,j)=>k.className=j===i?'on':'')});pk.appendChild(b)});

function loop(t){const dt=Math.min((t-last)/16.67,2)||1;last=t;if(state==='play')step(dt);if(state==='over')overT+=dt;draw(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
const intro=document.getElementById('intro');
for(let i=0;i<36;i++){const d=document.createElement('i');d.style.cssText='position:absolute;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(1+Math.random()*2)+'px;height:'+(1+Math.random()*2)+'px;border-radius:50%;background:#fff;opacity:.2;animation:tw '+(2+Math.random()*3)+'s '+Math.random()*2+'s ease-in-out infinite alternate';intro.appendChild(d)}
